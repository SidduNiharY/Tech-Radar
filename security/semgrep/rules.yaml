rules:
  - id: tr-no-trust-remote-code
    languages:
      - python
    severity: ERROR
    message: "SEC-23: trust_remote_code=True is forbidden; models must use verified local code"
    pattern-either:
      - pattern: $M.from_pretrained(..., trust_remote_code=True, ...)
      - pattern: from_pretrained(..., trust_remote_code=True, ...)

  - id: tr-no-torch-load
    languages:
      - python
    severity: ERROR
    message: "SEC-23: torch.load is forbidden; use GGUF or safetensors format"
    patterns:
      - pattern: torch.load(...)

  - id: tr-no-pickle-load
    languages:
      - python
    severity: ERROR
    message: "SEC-23: pickle deserialization is forbidden"
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: _pickle.load(...)
      - pattern: _pickle.loads(...)

  - id: tr-no-yaml-load
    languages:
      - python
    severity: ERROR
    message: "SEC-22: yaml.load is forbidden; use yaml.safe_load"
    pattern-either:
      - pattern: yaml.load(...)
      - pattern: yaml.unsafe_load(...)

  - id: tr-no-shell-true
    languages:
      - python
    severity: ERROR
    message: "SEC-22: subprocess execution with shell=True is forbidden"
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: tr-no-eval
    languages:
      - python
    severity: ERROR
    message: "SEC-22: eval() and exec() are forbidden"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: tr-no-verify-false
    languages:
      - python
    severity: ERROR
    message: "SEC-05: Disabling TLS verification (verify=False) is forbidden"
    pattern-either:
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: httpx.request(..., verify=False, ...)
      - pattern: httpx.get(..., verify=False, ...)
      - pattern: httpx.post(..., verify=False, ...)
      - pattern: httpx.put(..., verify=False, ...)
      - pattern: httpx.delete(..., verify=False, ...)
      - pattern: httpx.patch(..., verify=False, ...)
