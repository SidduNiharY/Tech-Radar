[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techradar"
version = "0.1.0"
description = "Personal local-first learning system and AI second brain"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3",
    "alembic",
    "pyyaml",
]

[project.optional-dependencies]
bot = [
    "python-telegram-bot",
    "procrastinate",
]
fetcher = [
    "httpx",
    "tldextract",
]
parser = [
    "trafilatura",
    "feedparser",
    "docling>=2.146",
]
worker = [
    "litellm>=1.106",
    "langgraph>=1.2",
    "procrastinate",
    "pgvector",
    "jinja2",
    "tldextract",
]
rag = [
    "sentence-transformers",
]
api = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "hatchling",
    "pytest>=9",
    "pytest-asyncio",
    "ruff>=0.17",
    "respx",
    "import-linter",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Plan documents hold short sketch code on purpose; ruff must not rewrite them.
extend-exclude = ["security/semgrep/rules.py", "docs/superpowers/plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: database integration tests",
    "egress: egress proxy integration tests",
    "live: live model or service tests",
    "slow: slow running tests",
]
addopts = "-m 'not db and not egress and not live and not slow'"

[tool.uv]
exclude-newer = "2026-11-07T00:00:00Z"

[tool.importlinter]
root_packages = ["techradar"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contract 1: parser isolation"
type = "forbidden"
source_modules = ["techradar.parser"]
forbidden_modules = ["httpx", "techradar.db", "techradar.llm"]

[[tool.importlinter.contracts]]
name = "Contract 2: reader isolation"
type = "forbidden"
source_modules = ["techradar.pipeline.reader"]
forbidden_modules = ["techradar.pipeline.writer", "techradar.db", "techradar.vault", "httpx", "subprocess"]

[[tool.importlinter.contracts]]
name = "Contract 3: writer isolation"
type = "forbidden"
source_modules = ["techradar.pipeline.writer"]
forbidden_modules = ["techradar.llm", "httpx"]

[[tool.importlinter.contracts]]
name = "Contract 4: fetcher isolation"
type = "forbidden"
source_modules = ["techradar.fetcher"]
forbidden_modules = ["techradar.llm", "techradar.pipeline", "techradar.vault"]

[[tool.importlinter.contracts]]
name = "Contract 5: one door (SEC-57)"
type = "forbidden"
source_modules = ["techradar.pipeline", "techradar.worker", "techradar.rag", "techradar.bot", "techradar.api"]
forbidden_modules = ["techradar.parser.html", "techradar.parser.feed", "techradar.parser.pdf"]

[[tool.importlinter.contracts]]
name = "Contract 6: intake isolation"
type = "forbidden"
source_modules = ["techradar.intake"]
forbidden_modules = ["httpx", "techradar.db", "techradar.llm"]

[[tool.importlinter.contracts]]
name = "Contract 7: rag isolation"
type = "forbidden"
source_modules = ["techradar.rag"]
forbidden_modules = ["httpx", "subprocess"]

