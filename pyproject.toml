[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techradar"
version = "0.1.0"
description = "Personal local-first learning system and AI second brain"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "pyyaml",
]

[project.optional-dependencies]
bot = [
    "python-telegram-bot",
]
fetcher = [
    "httpx",
    "tldextract",
]
parser = [
    "trafilatura",
    "feedparser",
    "docling>=2.146",
]
worker = [
    "litellm>=1.106",
    "langgraph>=1.2",
    "procrastinate",
    "pgvector",
    "jinja2",
    "tldextract",
]

[dependency-groups]
dev = [
    "hatchling",
    "pytest>=9",
    "pytest-asyncio",
    "ruff>=0.17",
    "respx",
    "import-linter",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["security/semgrep/rules.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: database integration tests",
    "egress: egress proxy integration tests",
    "live: live model or service tests",
    "slow: slow running tests",
]
addopts = "-m 'not db and not egress and not live and not slow'"

[tool.uv]
exclude-newer = "2026-11-07T00:00:00Z"
