version: 1
suite: "gate_cs"
description: "Sample GATE Computer Science evaluation dataset for LLM accuracy benchmarking"
items:
  - id: "gate-cs-01"
    subject: "Algorithms"
    topic: "Sorting & Searching"
    type: "mcq"
    question: "What is the worst-case time complexity of QuickSort when using deterministic pivot selection on an already sorted array?"
    options:
      A: "O(n log n)"
      B: "O(n^2)"
      C: "O(n)"
      D: "O(log n)"
    expected_answer: "B"
    explanation: "If pivot selection chooses the first or last element deterministically, the recursion degrades to depth n, yielding O(n^2)."

  - id: "gate-cs-02"
    subject: "Operating Systems"
    topic: "Deadlocks"
    type: "mcq"
    question: "Which of the following is NOT one of the Coffman conditions required for a deadlock to occur?"
    options:
      A: "Mutual Exclusion"
      B: "Hold and Wait"
      C: "Preemption"
      D: "Circular Wait"
    expected_answer: "C"
    explanation: "The condition is No Preemption. Preemption would prevent or resolve deadlocks."

  - id: "gate-cs-03"
    subject: "Database Management Systems"
    topic: "Normalization"
    type: "mcq"
    question: "A relation R is in Boyce-Codd Normal Form (BCNF) if for every non-trivial functional dependency X -> Y:"
    options:
      A: "Y is a prime attribute"
      B: "X is a superkey"
      C: "X is a candidate key and Y is prime"
      D: "R has no composite primary key"
    expected_answer: "B"
    explanation: "BCNF requires that for every non-trivial functional dependency X -> Y, X must be a superkey."

  - id: "gate-cs-04"
    subject: "Computer Networks"
    topic: "Subnetting"
    type: "nat"
    question: "Given IPv4 address block 192.168.1.0/26, what is the maximum number of usable host addresses in this subnet?"
    expected_answer: "62"
    explanation: "/26 has 32 - 26 = 6 host bits. 2^6 - 2 = 64 - 2 = 62 usable addresses (excluding network and broadcast addresses)."

  - id: "gate-cs-05"
    subject: "Theory of Computation"
    topic: "Regular Languages"
    type: "mcq"
    question: "Which of the following problems is undecidable for deterministic Turing machines?"
    options:
      A: "Emptiness of a regular language"
      B: "Finiteness of a context-free language"
      C: "Halting problem on arbitrary input"
      D: "Equivalence of two DFAs"
    expected_answer: "C"
    explanation: "The halting problem for Turing machines is classically undecidable (Turing, 1936)."
