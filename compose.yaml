x-hardened: &hardened-baseline
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *hardened-baseline
    image: pgvector/pgvector:0.8.0-pg18@sha256:a5b4c3d2e1f0a5b4c3d2e1f0a5b4c3d2e1f0a5b4c3d2e1f0a5b4c3d2e1f0a5b4
    read_only: false
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 200
    networks:
      - db
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - pg_superuser_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: techradar
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    <<: *hardened-baseline
    image: ollama/ollama:0.5.12@sha256:b6c5d4e3f2a1b6c5d4e3f2a1b6c5d4e3f2a1b6c5d4e3f2a1b6c5d4e3f2a1b6c5
    read_only: false
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 200
    networks:
      - llm
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama-pull:
    <<: *hardened-baseline
    profiles:
      - pull
    image: ollama/ollama:0.5.12@sha256:b6c5d4e3f2a1b6c5d4e3f2a1b6c5d4e3f2a1b6c5d4e3f2a1b6c5d4e3f2a1b6c5
    read_only: false
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 200
    networks:
      - egress_out
    volumes:
      - ollama:/root/.ollama
    command: ["sh", "-c", "ollama serve & sleep 5 && ollama pull \"$$MODEL\""]

  squid:
    <<: *hardened-baseline
    image: ubuntu/squid:6.6-24.04_beta@sha256:d1c0c4a7e9f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 200
    networks:
      - egress_internal
      - egress_out
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
      - /var/run
      - /var/spool/squid
      - /var/log/squid
    volumes:
      - ./infra/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 5s
      retries: 5

  egress-probe:
    <<: *hardened-baseline
    profiles:
      - test
    image: curlimages/curl:8.12.1@sha256:c2b3a4f5e6d7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 50
    user: "1000:1000"
    networks:
      - egress_internal
    environment:
      HTTP_PROXY: "http://squid:3128"
      HTTPS_PROXY: "http://squid:3128"


networks:
  db:
    internal: true
  llm:
    internal: true
  egress_internal:
    internal: true
  egress_out:
    internal: false

volumes:
  pgdata:
  ollama:

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
