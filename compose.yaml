# Containers are named techradar-<service>-1; the Falco rules and the
# alerter match on that prefix, so the project name is pinned here.
name: techradar

x-hardened: &hardened-baseline
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *hardened-baseline
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    read_only: false
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 200
    tmpfs:
      - /tmp
      # The server socket lives here; runtime state, not part of the image.
      - /run/postgresql:uid=999,gid=999,mode=3777
    networks:
      - db
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      # PostgreSQL 18 images keep data in a version subfolder under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - pg_superuser_password
      - tr_migrator_password
      - tr_app_password
      - tr_ro_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: techradar
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=role,ddl
      - -c
      - pgaudit.role=tr_auditor
      - -c
      - pgaudit.log_relation=on
      - -c
      - log_connections=on
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *hardened-baseline
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: migrate
    mem_limit: 512m
    cpus: "1.0"
    user: "1000:1000"
    networks:
      - db
    secrets:
      - tr_migrator_password
    environment:
      TR_SECRETS_DIR: /run/secrets
      # Settings() requires it even though migrations never use Telegram.
      TR_TELEGRAM_OWNER_CHAT_ID: "${TR_TELEGRAM_OWNER_CHAT_ID:-0}"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *hardened-baseline
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: bot
    mem_limit: 512m
    cpus: "1.0"
    user: "1000:1000"
    networks:
      db: {}
      llm: {}
      egress_internal:
        ipv4_address: 10.250.10.10
    secrets:
      - tr_ro_password
      - telegram_bot_token
    environment:
      TR_SECRETS_DIR: /run/secrets
      HTTP_PROXY: "http://squid:3128"
      HTTPS_PROXY: "http://squid:3128"
      TR_TELEGRAM_OWNER_CHAT_ID: "${TR_TELEGRAM_OWNER_CHAT_ID:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      squid:
        condition: service_healthy

  fetcher:
    <<: *hardened-baseline
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: fetcher
    mem_limit: 512m
    cpus: "1.0"
    user: "1000:1000"
    networks:
      db: {}
      egress_internal:
        ipv4_address: 10.250.10.11
    volumes:
      - ./data/raw:/data/raw
      - ./data/parse-jobs:/data/parse-jobs
      - ./infra/squid/allowlist.txt:/etc/squid/allowlist.txt:ro
      - ./infra/sources/sources.yaml:/etc/techradar/sources.yaml:ro
    secrets:
      - tr_app_password
    environment:
      TR_SECRETS_DIR: /run/secrets
      HTTP_PROXY: "http://squid:3128"
      HTTPS_PROXY: "http://squid:3128"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      squid:
        condition: service_healthy

  parser:
    <<: *hardened-baseline
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: parser
    network_mode: none
    mem_limit: 3g
    cpus: "2.0"
    user: "1000:1000"
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/library/originals:/data/library/originals:ro
      - ./data/parse-jobs:/data/parse-jobs
      - ./data/clean:/data/clean
      - ./data/quarantine:/data/quarantine
      - clamav-sock:/run/clamav
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *hardened-baseline
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    mem_limit: 2g
    cpus: "2.0"
    user: "1000:1000"
    networks:
      - db
      - llm
    volumes:
      - ./data/clean:/data/clean
      - ./data/raw:/data/raw
      - ./data/parse-jobs:/data/parse-jobs
      - ./data/vault:/data/vault
      - ./data/library-inbox:/data/library-inbox
      - ./data/library:/data/library
      - ./infra/sources:/infra/sources:ro
      - ./infra/squid/allowlist.txt:/etc/squid/allowlist.txt:ro
      - ./infra/models/roles.yaml:/infra/models/roles.yaml:ro
      - ./vault-seed:/vault-seed:ro
    secrets:
      - tr_app_password
    environment:
      TR_SECRETS_DIR: /run/secrets
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  clamav:
    <<: *hardened-baseline
    image: clamav/clamav:1.4.6@sha256:cbc30de94b6e9b33ac14136ff45306cee02a1f9ae522394a3cc5b9215d1affe9
    network_mode: none
    mem_limit: 2g
    cpus: "1.0"
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav-db:/var/lib/clamav:ro
      - clamav-sock:/run/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "10"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  clamav-update:
    <<: *hardened-baseline
    image: clamav/clamav:1.4.6@sha256:cbc30de94b6e9b33ac14136ff45306cee02a1f9ae522394a3cc5b9215d1affe9
    mem_limit: 512m
    cpus: "0.5"
    networks:
      egress_internal:
        ipv4_address: 10.250.10.12
    environment:
      HTTP_PROXY: "http://squid:3128"
      HTTPS_PROXY: "http://squid:3128"
    volumes:
      - clamav-db:/var/lib/clamav
      - ./infra/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    command: ["freshclam", "--foreground", "--daemon", "--checks=12"]
    restart: unless-stopped

  ollama:
    <<: *hardened-baseline
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    read_only: false
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 200
    networks:
      - llm
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama-pull:
    <<: *hardened-baseline
    profiles:
      - pull
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    read_only: false
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 200
    networks:
      - egress_out
    volumes:
      - ollama:/root/.ollama
    command: ["sh", "-c", "ollama serve & sleep 5 && ollama pull \"$$MODEL\""]

  squid:
    <<: *hardened-baseline
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 200
    networks:
      egress_internal:
        ipv4_address: 10.250.10.2
      egress_out: {}
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
      - /var/run
      # Squid drops to its proxy user (uid 13), which must own these.
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
    volumes:
      - ./infra/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 5s
      retries: 5

  egress-probe:
    <<: *hardened-baseline
    profiles:
      - test
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 50
    user: "1000:1000"
    networks:
      egress_internal:
        ipv4_address: 10.250.10.20
    environment:
      HTTP_PROXY: "http://squid:3128"
      HTTPS_PROXY: "http://squid:3128"
      # curl ignores upper-case HTTP_PROXY for plain http (httpoxy defence).
      http_proxy: "http://squid:3128"
      https_proxy: "http://squid:3128"

  redteam:
    <<: *hardened-baseline
    profiles:
      - test
    image: ghcr.io/promptfoo/promptfoo:0.125.1@sha256:3ddd7be2b8b043a5c48f0df048b074396de8e60282b0a3b392c299c430b74134
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 100
    user: "1000:1000"
    networks:
      - llm
    volumes:
      - ./security/redteam:/app/redteam:ro
    environment:
      PROMPTFOO_DISABLE_TELEMETRY: "true"
      PROMPTFOO_CONFIG_DIR: /tmp
    command: ["eval", "-c", "/app/redteam/promptfooconfig.yaml"]

  evals:
    <<: *hardened-baseline
    profiles:
      - test
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    mem_limit: 2g
    cpus: "2.0"
    user: "1000:1000"
    networks:
      - db
      - llm
    volumes:
      - ./evals:/app/evals:ro
      - ./data/vault:/data/vault:ro
    environment:
      TR_SECRETS_DIR: /run/secrets
    secrets:
      - tr_ro_password
    # The image has no uv (see infra/docker/Dockerfile); run from the .venv.
    command: ["python", "evals/rag/run.py"]




networks:
  db:
    internal: true
  llm:
    internal: true
  egress_internal:
    internal: true
    # Fixed addresses: the alerter maps a Squid client IP to its service from
    # this file (short-lived containers exit before a runtime lookup).
    ipam:
      config:
        - subnet: 10.250.10.0/24
          # Automatic addresses come from the top half only, so they never
          # reuse a fixed one (all fixed addresses are below .128).
          ip_range: 10.250.10.128/25
  egress_out:
    internal: false

volumes:
  pgdata:
  ollama:
  clamav-db:
  clamav-sock:

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  tr_migrator_password:
    file: ./secrets/tr_migrator_password
  tr_app_password:
    file: ./secrets/tr_app_password
  tr_ro_password:
    file: ./secrets/tr_ro_password
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
