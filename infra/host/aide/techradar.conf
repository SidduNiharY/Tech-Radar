# TechRadar AIDE configuration

@@define DBDIR /var/lib/aide
@@define LOGDIR /var/log/aide

database_in=file:@@{DBDIR}/aide.db
database_out=file:@@{DBDIR}/aide.db.new
gzip_dbout=yes

# Rule definitions
NORMAL = R+b+sha512
DIR = p+i+n+u+g

# Monitored system and repository paths
/usr/bin NORMAL
/usr/sbin NORMAL
/etc NORMAL
/etc/systemd/system NORMAL
/home/techradar/TechRadarBrain/compose.yaml NORMAL
/home/techradar/TechRadarBrain/infra NORMAL

# Honeytoken exclusions: do not alert on honeytoken files or exclusion lists
!/var/lib/techradar-honey/excludes.txt
!/home/techradar/TechRadarBrain/secrets/aws_root_key.txt
!/home/techradar/TechRadarBrain/.env.production
!/var/lib/techradar-honey
