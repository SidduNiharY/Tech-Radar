- rule: TR shell or package manager in container
  desc: A shell or package manager was spawned inside an application container
  condition: >
    evt.type in (execve, execveat) and
    tr_app_container and
    proc.name in (sh, bash, dash, ash, zsh, apt, apt-get, dpkg, pip, pip3, npm, npx, uv)
  output: "Shell or package manager spawned in container (user=%user.name container=%container.name proc=%proc.name cmdline=%proc.cmdline)"
  priority: CRITICAL
  tags: [security, container]

- rule: TR network tool in container
  desc: A network tool was spawned inside an application container
  condition: >
    evt.type in (execve, execveat) and
    tr_app_container and
    proc.name in (curl, wget, nc, ncat, socat, ssh, scp, telnet)
  output: "Network tool spawned in container (user=%user.name container=%container.name proc=%proc.name cmdline=%proc.cmdline)"
  priority: CRITICAL
  tags: [security, network, container]

- rule: TR unexpected program
  desc: A process outside the service allowed list started inside a container
  condition: >
    evt.type in (execve, execveat) and
    tr_app_container and (
      (container.name startswith "techradar-bot" and not proc.name in (tr_bot_programs)) or
      (container.name startswith "techradar-migrate" and not proc.name in (tr_migrate_programs)) or
      (container.name startswith "techradar-postgres" and not proc.name in (tr_postgres_programs)) or
      (container.name startswith "techradar-squid" and not proc.name in (tr_squid_programs)) or
      (container.name startswith "techradar-clamav-update" and not proc.name in (tr_clamav-update_programs)) or
      (container.name startswith "techradar-clamav" and not container.name startswith "techradar-clamav-update" and not proc.name in (tr_clamav_programs)) or
      (container.name startswith "techradar-fetcher" and not proc.name in (tr_fetcher_programs)) or
      (container.name startswith "techradar-parser" and not proc.name in (tr_parser_programs)) or
      (container.name startswith "techradar-worker" and not proc.name in (tr_worker_programs)) or
      (container.name startswith "techradar-ollama" and not proc.name in (tr_ollama_programs))
    )
  output: "Unexpected program started in container (container=%container.name proc=%proc.name cmdline=%proc.cmdline)"
  priority: WARNING
  tags: [security, container]

- rule: TR connection from no-network service
  desc: Network connection attempt from a service marked no-network
  condition: >
    evt.type = connect and (
      container.name startswith "techradar-parser" or
      (container.name startswith "techradar-clamav" and not container.name startswith "techradar-clamav-update")
    )
  output: "Network connection attempt from no-network service (container=%container.name fd.name=%fd.name)"
  priority: CRITICAL
  tags: [security, network, container]

- rule: TR connection outside allowed peers
  desc: Internal-only container connected to an address outside Docker networks
  condition: >
    evt.type = connect and (
      container.name startswith "techradar-worker" or
      container.name startswith "techradar-migrate" or
      container.name startswith "techradar-jarvis" or
      container.name startswith "techradar-api" or
      container.name startswith "techradar-postgres" or
      container.name startswith "techradar-ollama" or
      container.name startswith "techradar-voice-worker"
    ) and not (
      fd.rnet in (127.0.0.0/8, 172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16)
    )
  output: "Internal-only container connecting outside allowed peers (container=%container.name fd.name=%fd.name)"
  priority: CRITICAL
  tags: [security, network, container]

- rule: TR outbound not via squid
  desc: Outbound internet connection initiated directly rather than through Squid proxy
  condition: >
    evt.type = connect and (
      container.name startswith "techradar-fetcher" or
      container.name startswith "techradar-bot" or
      container.name startswith "techradar-changedetection" or
      container.name startswith "techradar-searxng" or
      container.name startswith "techradar-clamav-update"
    ) and not (
      fd.rnet in (127.0.0.0/8, 172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16)
    )
  output: "Outbound connection not routed via squid (container=%container.name fd.name=%fd.name)"
  priority: CRITICAL
  tags: [security, network, container]

- rule: TR secret read by unexpected program
  desc: A secret file was opened by a program outside the service allowed list
  condition: >
    evt.type in (open, openat, openat2) and
    fd.name startswith "/run/secrets/" and
    tr_app_container and (
      (container.name startswith "techradar-bot" and not proc.name in (tr_bot_programs)) or
      (container.name startswith "techradar-migrate" and not proc.name in (tr_migrate_programs)) or
      (container.name startswith "techradar-postgres" and not proc.name in (tr_postgres_programs)) or
      (container.name startswith "techradar-squid" and not proc.name in (tr_squid_programs)) or
      (container.name startswith "techradar-clamav-update" and not proc.name in (tr_clamav-update_programs)) or
      (container.name startswith "techradar-clamav" and not container.name startswith "techradar-clamav-update" and not proc.name in (tr_clamav_programs)) or
      (container.name startswith "techradar-fetcher" and not proc.name in (tr_fetcher_programs)) or
      (container.name startswith "techradar-parser" and not proc.name in (tr_parser_programs)) or
      (container.name startswith "techradar-worker" and not proc.name in (tr_worker_programs)) or
      (container.name startswith "techradar-ollama" and not proc.name in (tr_ollama_programs))
    )
  output: "Secret opened by unexpected program (container=%container.name file=%fd.name proc=%proc.name cmdline=%proc.cmdline)"
  priority: CRITICAL
  tags: [security, secrets, container]

- rule: TR write outside tmpfs or volumes
  desc: File write to container filesystem outside allowed tmpfs or volume paths
  condition: >
    evt.type in (open, openat, openat2) and
    evt.is_open_write = true and
    tr_app_container and
    not (
      fd.name startswith "/tmp/" or
      fd.name startswith "/dev/" or
      fd.name startswith "/proc/" or
      fd.name startswith "/data/" or
      (container.name startswith "techradar-postgres" and
        (fd.name startswith "/var/lib/postgresql/" or fd.name startswith "/var/run/postgresql/")) or
      (container.name startswith "techradar-squid" and
        (fd.name startswith "/var/spool/squid/" or fd.name startswith "/var/log/squid/" or fd.name startswith "/var/run/")) or
      (container.name startswith "techradar-ollama" and
        (fd.name startswith "/root/.ollama/")) or
      (container.name startswith "techradar-clamav" and not container.name startswith "techradar-clamav-update" and fd.name startswith "/run/clamav/") or
      (container.name startswith "techradar-clamav-update" and fd.name startswith "/var/lib/clamav/")
    )
  output: "Write outside allowed tmpfs or volume paths (container=%container.name file=%fd.name proc=%proc.name)"
  priority: WARNING
  tags: [security, container]

- rule: TR new root process
  desc: A process with UID 0 started in a container not excepted in root_start
  condition: >
    evt.type in (execve, execveat) and
    tr_app_container and user.uid = 0 and
    not (
      container.name startswith "techradar-postgres" or
      container.name startswith "techradar-squid"
    )
  output: "Root process spawned in non-root container (container=%container.name proc=%proc.name cmdline=%proc.cmdline)"
  priority: CRITICAL
  tags: [security, container]

- rule: TR docker socket access
  desc: Docker socket was accessed from inside a container
  condition: >
    evt.type in (open, openat, openat2, connect) and
    container.id != host and
    fd.name = "/var/run/docker.sock"
  output: "Docker socket accessed from inside container (container=%container.name proc=%proc.name cmdline=%proc.cmdline)"
  priority: CRITICAL
  tags: [security, container]
