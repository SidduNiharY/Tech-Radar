# Drop-in for falco-modern-bpf.service (installed by infra/host/install_host.sh).
# Falco's events reach the alerter through the journal:
# - the packaged unit sets StandardOutput=null, which throws every event away;
# - journald drops messages from a unit that logs faster than its rate
#   limit, which would hide events during a flood, so Falco is exempt.
[Service]
StandardOutput=journal
LogRateLimitIntervalSec=0
