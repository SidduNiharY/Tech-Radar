services:
  bot: [python]
  fetcher: [python]
  parser: [python]
  worker: [python]
  clamav: [clamd]
  clamav-update: [freshclam]
  migrate: [alembic, python]
  postgres: [postgres, pg_isready, pg_dump, pg_restore, psql]
  squid: [squid, log_file_daemon]
  ollama: [ollama]
internal_only:
  - worker
  - migrate
  - jarvis
  - api
  - postgres
  - ollama
  - voice-worker
no_network:
  - parser
  - clamav
root_start:
  - postgres
  - squid
  - clamav
  - clamav-update
excluded_profiles:
  - ollama-pull
  - egress-probe
  - evals
  - redteam
  - zap
